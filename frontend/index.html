<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - MotorFix</title>
    <link rel="stylesheet" href=".../frontend/index.css">
</head>
<body>
    <header>
        <a href="index.html">MotorFix</a>
    </header>
        <section>
            <h1>Iniciar sesión</h1>

            <!-- El formulario no se envía solo: el botón es type="button" y lo gestiona login.js con fetch() -->
            <form id="formLogin" >
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <!-- Aquí se mostrarán los mensajes de error o de éxito desde JS -->
                <p id="mensaje" role="alert"></p>

                <button type="button" id="entrar">Entrar</button>
            </form>

            <p>¿No tienes cuenta? <a href="registroUsuario.html">Crear cuenta</a></p>
        </section>
    <footer>
        <p>MotorFix - Taller mecánico</p>
    </footer>

    <script src="../js/login.js"></script>
</body>
</html>
