<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - MotorFix</title>
    <link rel="stylesheet" href=".../frontend/index.css">
</head>
    <body>
        <header>
            <a href="index.html">MotorFix</a>
        </header>

        <section>
            <div>
                <h1>Crear cuenta</h1>
                <h4>Regístrate para pedir cita y consultar el estado de tus reparaciones.</h4>
            </div>
            <form id="formRegistro" >
                <fieldset>
                    <legend>Datos personales</legend>
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" maxlength="60" required>
                    </div>
                    <div>
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" maxlength="100" required>
                    </div>
                    <div>
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni" maxlength="9"
                               pattern="[0-9]{8}[A-Za-z]" placeholder="12345678Z" required>
                    </div>
                    <div>
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" maxlength="15"
                               pattern="[0-9]{9}" placeholder="600111222" required>
                    </div>
                </fieldset>
 
                <fieldset>
                    <legend>Datos de acceso</legend>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" maxlength="120" placeholder="tucorreo@ejemplo.com" required>
                    </div>
                    <div>
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" minlength="8" required>
                        <small>Mínimo 8 caracteres.</small>
                    </div>
                    <div>
                        <label for="password2">Repetir contraseña</label>
                        <input type="password" id="password2" name="password2" minlength="8" required>
                    </div>
                </fieldset>
                <button type="button" id="registrar">Crear cuenta</button>
            </form>
            <div>¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></div>
        </section>

        <footer>
            <div>MotorFix - Taller mecánico</div>
        </footer>
    </body>
</html>
